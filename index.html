<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG 1401</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }
        
        #loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4285F4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Sidebar Kiri Kustom */
        #sidebar {
            position: absolute;
            top: 0; left: 0;
            width: 350px; height: 100vh;
            background: #ffffff;
            z-index: 2000;
            display: none;
            flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.2);
        }
        
        #sidebar-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            position: relative;
        }

        #close-sidebar {
            position: absolute;
            right: 15px; top: 15px;
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
        }

        #sidebar-update-info {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
        }

        #sidebar-sls-info {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        #sidebar-layer-panel {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .layer-group-title { font-weight: bold; margin-bottom: 3px; font-size: 14px; color: #555;}
        .layer-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .color-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

        #sidebar-building-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:hover { background: #f1f1f1; }
        .list-item .item-text { font-size: 13px; color: #333; font-weight: 500; text-transform: uppercase; }
        .list-item .arrow-icon { margin-left: auto; color: #888; font-weight: bold; font-size: 16px; }

        #gear-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 1000;
            background: white; border: 2px solid #555; border-radius: 50%;
            width: 55px; height: 55px; display: flex; align-items: center;
            justify-content: center; font-size: 28px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }

        #locate-btn {
            position: absolute; bottom: 25px; right: 95px; z-index: 1000;
            background: white; border: 2px solid #555; border-radius: 50%;
            width: 55px; height: 55px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }

        #settings-panel {
            position: absolute; bottom: 95px; right: 25px; z-index: 1000;
            background: white; border-radius: 12px; box-shadow: 0 6px 25px rgba(0,0,0,0.35);
            padding: 20px; width: 300px; display: none; flex-direction: column; gap: 12px;
            max-height: 80vh; overflow-y: auto;
        }
        
        #settings-panel h3 { margin: 5px 0 8px 0; text-align: center; color: #333; font-size: 14px; border-top: 1px solid #eee; padding-top: 8px; }
        
        .search-group { display: flex; gap: 5px; margin-bottom: 5px; }
        .search-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .search-group button { padding: 8px 12px; background: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 100%; }

        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

        #reset-filter {
            padding: 8px 12px; background: #dc3545; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }

        .copy-btn {
            cursor: pointer; margin-left: 8px; font-size: 12px; vertical-align: middle;
            background: rgba(0,0,0,0.1); padding: 2px 5px; border-radius: 4px;
        }

        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 12px 20px;
            border-radius: 10px; z-index: 3000; display: none; font-size: 14px;
        }

        .active-label {
            background: rgba(0, 0, 0, 0.2); color: #00FF00; border: none; box-shadow: none;
            font-size: 13px; font-weight: bold; text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
            padding: 2px 4px; border-radius: 4px;
        }
        .active-label::before { display: none; }

        .no-bang-label {
            background: transparent; border: none; box-shadow: none; font-size: 11px;
            font-weight: bold; color: #000;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }
        .no-bang-label::before { display: none; }

         /* Animasi Pulse Marker */
        .pulse-marker-container {
            width: 36px;
            height: 36px;
            position: relative;
        }
        .pulse-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid #ff4444;
            border-radius: 50%;
            animation: pulse-wave 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .pulse-dot {
            position: absolute;
            top: 10px; left: 10px;
            width: 16px; height: 16px;
            background-color: #ff0000;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }
        @keyframes pulse-wave {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

    </style>
</head>
<body>
    <div id="loader-overlay">
        <div class="spinner"></div>
        <p id="loader-text" style="font-weight: bold; color: #333;">Memvalidasi Akses...</p>
    </div>

    <div id="sidebar">
        <div id="sidebar-header">
            <button id="close-sidebar" onclick="closeSidebar()">✖</button>
            <div id="sidebar-update-info">Update: Memuat...</div>
            <div id="sidebar-sls-info"></div>
        </div>

        <div id="sidebar-layer-panel">
            <div class="layer-group-title">
                Assignment SUBMIT+ <span id="cnt-total-submit" style="color: #4285F4; font-weight: bold;">(0)</span>
            </div>
            <label class="layer-item">
                <input type="checkbox" id="chk-khusus-usaha" checked>
                <span class="color-dot" style="background: #ff8c00;"></span> Khusus Usaha <span id="cnt-khusus" style="color: #666; font-weight: bold;">(0)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" id="chk-keluarga-ada-usaha" checked>
                <span class="color-dot" style="background: #c71585;"></span> Keluarga Ada Usaha <span id="cnt-ada-usaha" style="color: #666; font-weight: bold;">(0)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" id="chk-keluarga-saja" checked>
                <span class="color-dot" style="background: #1f77b4;"></span> Keluarga Saja <span id="cnt-keluarga" style="color: #666; font-weight: bold;">(0)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" id="chk-bangunan-lainnya" checked>
                <span class="color-dot" style="background: #2ca02c;"></span> Bangunan Lainnya <span id="cnt-lainnya" style="color: #666; font-weight: bold;">(0)</span>
            </label>
            
            <div class="layer-group-title" style="margin-top: 8px;">Assignment DRAFT</div>
            <label class="layer-item">
                <input type="checkbox" id="chk-draft" checked>
                <span class="color-dot" style="background: #d62728;"></span> Assignment DRAFT <span id="cnt-draft" style="color: #666; font-weight: bold;">(0)</span>
            </label>
        </div>

        <div id="sidebar-building-list"></div>
    </div>

    <div id="map"></div>
    <div id="toast">Berhasil disalin</div>

    <div id="gear-btn" title="Pengaturan Filter">⚙</div>
    <div id="locate-btn" title="Lokasi Saya">📍</div>

    <div id="settings-panel">
        <div class="checkbox-item" style="margin-bottom: 10px;">
            <input type="checkbox" id="toggle-bangunan" checked>
            <label for="toggle-bangunan">Tampilkan Titik Bangunan</label>
        </div>

        <h3>Cari Sub-SLS</h3>
        <div class="search-group">
            <input type="text" id="search-id" placeholder="Masukkan ID Sub-SLS...">
            <button id="btn-search">Cari</button>
        </div>

        <h3>Filter Wilayah</h3>
        <div class="filter-group">
            <select id="sel-kec"><option value="">-- Pilih Kecamatan --</option></select>
        </div>

        <div id="desa-checkbox-container" style="display:none;">
            <h3>Desa dalam Kecamatan</h3>
            <div class="checkbox-group" id="desa-checkboxes"></div>
        </div>

        <button id="reset-filter">Reset Filter</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    
    <script>
        const SB_URL = "https://dephwldquypktcflpuon.supabase.co";
        let SB_KEY = "";
        let supabaseClient = null;

        const map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([-2.5489, 118.0149], 16);
        let slsLayer = null, userMarker = null, selectedLayer = null;
        let activeLabelGroup = L.layerGroup().addTo(map);
        let bangunanLayerGroup = L.layerGroup().addTo(map); 
        let excelBangunanData = []; 
        let showBangunan = true; 

        let allFeatures = [];
        let supabaseData = [];
        let currentKecFilter = null;
        let currentDesaFilters = new Set();

        const baseLayers = {
            "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 }).addTo(map),
            "Google Satellite": L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20 }),
            "Google Hybrid": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20 }),
            "Google Street": L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20 }),
            "ESRI Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 19 })
        };
        L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

        const slsStyle = { color: '#FF0000', weight: 2.5, opacity: 1, fillOpacity: 0 };
        const slsHighlightStyle = { color: '#FFFF00', weight: 5, opacity: 1, fillOpacity: 0.05 };

        async function loadExcelData() {
           try {
                const response = await fetch('tk.cdt');
                if (!response.ok) throw new Error("File tk.cdt tidak ditemukan.");
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const cellA1 = worksheet['A1'];
                if (cellA1 && cellA1.v) {
                    let valStr = String(cellA1.v).padStart(12, '0');
                    if (valStr.length >= 12) {
                        const dd = valStr.substring(0, 2);
                        const mm = valStr.substring(2, 4);
                        const yyyy = valStr.substring(4, 8);
                        const hh = valStr.substring(8, 10);
                        const mnt = valStr.substring(10, 12);
                        
                        document.getElementById('sidebar-update-info').innerText = `Update: ${dd}/${mm}/${yyyy} - ${hh}.${mnt}`;
                    }
                }
                excelBangunanData = XLSX.utils.sheet_to_json(worksheet);
            } catch (err) {
                console.warn("Gagal memuat file tk.cdt:", err);
            }
        }

        async function validateAndStart() {
            let savedKey = localStorage.getItem("sb_key");
            const loader = document.getElementById('loader-overlay');
            const loaderText = document.getElementById('loader-text');

            while (true) {
                if (!savedKey) {
                    savedKey = prompt("Masukkan Kode Akses:");
                    if (savedKey === null) {
                        document.body.innerHTML = "<h2 style='padding:20px; text-align:center;'>Akses dibatalkan. Segarkan halaman untuk mencoba lagi.</h2>";
                        return;
                    }
                }

                if (savedKey) {
                    loader.style.display = 'flex';
                    loaderText.innerText = "Memvalidasi Akses...";

                    try {
                        const tempClient = supabase.createClient(SB_URL, savedKey);
                        const { error } = await tempClient.from('sb_sls').select('idsubsls').limit(1);
                        
                        if (!error) {
                            SB_KEY = savedKey;
                            supabaseClient = tempClient;
                            localStorage.setItem("sb_key", SB_KEY);
                            
                            loaderText.innerText = "Memuat data peta...";
                            await loadExcelData();
                            await loadGeoJSON(); 
                            loader.style.display = 'none';
                            break; 
                        } else {
                            loader.style.display = 'none';
                            localStorage.removeItem("sb_key");
                            savedKey = "";
                            alert("Kode tidak valid atau akses ditolak.");
                        }
                    } catch (e) {
                        loader.style.display = 'none';
                        localStorage.removeItem("sb_key");
                        savedKey = "";
                        alert("Terjadi kesalahan saat validasi.");
                    }
                }
            }
        }

        function closeGearPanel() {
            const p = document.getElementById('settings-panel');
            if (p.style.display === 'flex') p.style.display = 'none';
        }

        function closeSidebar() {
            document.getElementById('sidebar').style.display = 'none';
            if (selectedLayer) slsLayer.resetStyle(selectedLayer);
            selectedLayer = null;
            activeLabelGroup.clearLayers();
            bangunanLayerGroup.clearLayers();
        }

        async function loadGeoJSON() {
            try {
                let dbData = [];
                let from = 0;
                let to = 999;
                let hasMore = true;

                while (hasMore) {
                    const { data, error: fetchError } = await supabaseClient
                        .from('sb_sls')
                        .select('*')
                        .range(from, to);

                    if (fetchError) throw fetchError;

                    dbData = [...dbData, ...data];
                    if (data.length < 1000) hasMore = false;
                    else { from += 1000; to += 1000; }
                }

                supabaseData = dbData;
                const slsRes = await fetch('sls.geojson');
                const slsData = await slsRes.json();
                
                allFeatures = slsData.features.map(f => {
                    const match = supabaseData.find(d => d.idsubsls == f.properties.idsubsls);
                    return { ...f, properties: { ...f.properties, ...(match || {}) } };
                });
                
                slsLayer = L.geoJSON({ type: "FeatureCollection", features: allFeatures }, {
                    style: slsStyle,
                    onEachFeature: function(feature, layer) {
                        if (feature.properties?.nmsls) layer.bindTooltip(feature.properties.nmsls, { sticky: true });
                        layer.on('click', (e) => { 
                            closeGearPanel();
                            highlightFeature(e.target); 
                            updateSidebarInfo(feature.properties); 
                        });
                    }
                }).addTo(map);

                populateKecamatanDropdown();
                locateUser(true);
            } catch (err) { 
                console.error("Data Error:", err);
                alert("Gagal memuat semua data dari server.");
            }
        }

        function populateKecamatanDropdown() {
            const selKec = document.getElementById('sel-kec');
            const uniqueKec = [...new Set(allFeatures.map(f => `${f.properties.kdkec}|${f.properties.nmkec}`))]
                .filter(i => !i.includes('undefined'))
                .sort((a, b) => a.split('|')[0].localeCompare(b.split('|')[0]));
                
            uniqueKec.forEach(item => {
                const [kd, nm] = item.split('|');
                selKec.add(new Option(`${kd} - ${nm}`, kd));
            });

            selKec.onchange = () => {
                currentKecFilter = selKec.value;
                currentDesaFilters.clear();
                
                if (currentKecFilter) {
                    centerToKecamatan(currentKecFilter);
                    renderDesaCheckboxes();
                    applyFilters();
                } else {
                    resetAllFilters();
                }
            };
        }

        function centerToKecamatan(kdkec) {
            const kecFeatures = allFeatures.filter(f => f.properties.kdkec === kdkec);
            if (kecFeatures.length === 0) return;

            let bounds = L.latLngBounds([]);
            kecFeatures.forEach(f => {
                const layer = L.geoJSON(f);
                bounds.extend(layer.getBounds());
            });

            map.flyToBounds(bounds, { padding: [20, 20], duration: 1.2 });
        }

        function renderDesaCheckboxes() {
            const container = document.getElementById('desa-checkboxes');
            const wrapper = document.getElementById('desa-checkbox-container');
            container.innerHTML = '';

            const filtered = allFeatures.filter(f => f.properties.kdkec === currentKecFilter);
            const uniqueDesa = [...new Set(filtered.map(f => `${f.properties.kddesa}|${f.properties.nmdesa}`))]
                .filter(i => !i.includes('undefined'))
                .sort((a, b) => a.split('|')[0].localeCompare(b.split('|')[0]));

            uniqueDesa.forEach(item => {
                const [kd, nm] = item.split('|');
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="desa-${kd}" value="${kd}">
                    <label for="desa-${kd}">${kd} - ${nm}</label>
                `;
                div.querySelector('input').onchange = function() {
                    if (this.checked) currentDesaFilters.add(this.value);
                    else currentDesaFilters.delete(this.value);
                    applyFilters();
                };
                container.appendChild(div);
            });
            wrapper.style.display = 'block';
        }

        function applyFilters() {
            if (!slsLayer) return;

            slsLayer.eachLayer(layer => {
                const props = layer.feature.properties;
                const kecMatch = !currentKecFilter || props.kdkec === currentKecFilter;
                const desaMatch = currentDesaFilters.size === 0 || currentDesaFilters.has(props.kddesa);

                if (kecMatch && desaMatch) {
                    layer.setStyle(slsStyle);
                    layer.options.interactive = true;
                } else {
                    layer.setStyle({ opacity: 0, fillOpacity: 0 });
                    layer.options.interactive = false;
                }
            });
        }

        function resetAllFilters() {
            currentKecFilter = null;
            currentDesaFilters.clear();
            document.getElementById('sel-kec').value = '';
            document.getElementById('search-id').value = '';
            document.getElementById('desa-checkbox-container').style.display = 'none';
            document.getElementById('desa-checkboxes').innerHTML = '';

            if (slsLayer) {
                slsLayer.eachLayer(layer => {
                    layer.setStyle(slsStyle);
                    layer.options.interactive = true;
                });
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 1000);
            });
        }

        function updateSidebarInfo(props) {
            const slsBox = document.getElementById('sidebar-sls-info');
            const iidsubsls = props.idsubsls || '-';
            const inmsls = props.nmsls || '-';
            slsBox.innerHTML = `
                [${iidsubsls}] <span class="copy-btn" onclick="copyToClipboard('${iidsubsls}')" title="Salin ID">📋</span><br>
                ${inmsls}
            `;
            document.getElementById('sidebar').style.display = 'flex';
        }

        function showActiveLabel(targetLayer) {
            activeLabelGroup.clearLayers();
            const targetGeo = targetLayer.toGeoJSON();
            const targetCenter = turf.centerOfMass(targetGeo);
            L.marker([targetCenter.geometry.coordinates[1], targetCenter.geometry.coordinates[0]], {
                icon: L.divIcon({
                    className: 'active-label',
                    html: targetLayer.feature.properties.kdsls || '',
                    iconSize: [40, 20],
                    iconAnchor: [20, 10]
                }),
                interactive: false
            }).addTo(activeLabelGroup);
        }

        function panToBuilding(lat, lng) {
            map.flyTo([lat, lng], 20, { duration: 1 });
            
            // Render elemen pulse marker
            const pulseIcon = L.divIcon({
                className: '',
                html: `
                    <div class="pulse-marker-container">
                        <div class="pulse-ring"></div>
                        <div class="pulse-dot"></div>
                    </div>
                `,
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });

            const pulseLayer = L.marker([lat, lng], { icon: pulseIcon, interactive: false }).addTo(map);
            
            // Hapus animasi setelah 3 detik
            setTimeout(() => {
                if(map.hasLayer(pulseLayer)) {
                    map.removeLayer(pulseLayer);
                }
            }, 3000);
        }

        function renderBangunanForSelectedSLS(idsubsls) {
            bangunanLayerGroup.clearLayers();
            document.getElementById('sidebar-building-list').innerHTML = '';
            
            let cKhusus = 0, cAdaUsaha = 0, cKeluarga = 0, cLainnya = 0, cDraft = 0;

            if (!showBangunan || !idsubsls) {
                updateCounterUI(0, 0, 0, 0, 0); 
                return;
            }

            const chkKhusus = document.getElementById('chk-khusus-usaha').checked;
            const chkAdaUsaha = document.getElementById('chk-keluarga-ada-usaha').checked;
            const chkKeluarga = document.getElementById('chk-keluarga-saja').checked;
            const chkLainnya = document.getElementById('chk-bangunan-lainnya').checked;
            const chkDraft = document.getElementById('chk-draft').checked;

            const matchingPoints = excelBangunanData.filter(item => {
                return item.idsubsls == idsubsls &&
                    item.geotag_latitude != null &&
                    item.geotag_longitude != null &&
                    !isNaN(parseFloat(item.geotag_latitude)) &&
                    !isNaN(parseFloat(item.geotag_longitude));
            });

            let listHTML = '';

            matchingPoints.forEach(pt => {
                const lat = parseFloat(pt.geotag_latitude);
                const lng = parseFloat(pt.geotag_longitude);
                const nama = pt.nama_principal || 'Tanpa Nama Bangunan';
                const noBang = pt.no_bang !== undefined && pt.no_bang !== null ? pt.no_bang : '';

                const status = (pt.status_assignment || '').toString().toUpperCase();
                const label = parseInt(pt.label_bangunan);
                const jmlUsaha = parseFloat(pt.jumlah_usaha_ditemukan) || 0;
                
                let isVisible = false;
                let finalColor = '#6c757d'; 

                if (status.includes('DRAFT')) {
                    cDraft++;
                    if (chkDraft) { isVisible = true; finalColor = '#d62728'; }
                } else {
                    if (label === 1) {
                        cKhusus++;
                        if (chkKhusus) { isVisible = true; finalColor = '#ff8c00'; }
                    } else if ((label === 2 || label === 3) && jmlUsaha > 0) { 
                        cAdaUsaha++;
                        if (chkAdaUsaha) { isVisible = true; finalColor = '#c71585'; }
                    } else if (label === 3 && jmlUsaha === 0) {
                        cKeluarga++;
                        if (chkKeluarga) { isVisible = true; finalColor = '#1f77b4'; }
                    } else if (label === 4) {
                        cLainnya++;
                        if (chkLainnya) { isVisible = true; finalColor = '#2ca02c'; }
                    }
                }

                if (!isVisible) return; 

                listHTML += `
                    <div class="list-item" onclick="panToBuilding(${lat}, ${lng})">
                        <span class="color-dot" style="background: ${finalColor}; margin-right: 12px;"></span>
                        <span class="item-text">(${noBang !== '' ? noBang : '-'}) ${nama}</span>
                        <span class="arrow-icon">❯</span>
                    </div>
                `;

                const circle = L.circleMarker([lat, lng], {
                    radius: 7, fillColor: finalColor, color: '#ffffff',
                    weight: 2, opacity: 1, fillOpacity: 0.9
                });

                circle.bindPopup(`<b>(${noBang}) ${nama}</b>`);
                if (noBang !== '') {
                    circle.bindTooltip(String(noBang), {
                        permanent: true, direction: 'top', className: 'no-bang-label', offset: [0, -5]
                    });
                }
                circle.addTo(bangunanLayerGroup);
            });

            document.getElementById('sidebar-building-list').innerHTML = listHTML;
            updateCounterUI(cKhusus, cAdaUsaha, cKeluarga, cLainnya, cDraft);
        }

        function updateCounterUI(khusus, adaUsaha, keluarga, lainnya, draft) {
            const totalSubmit = khusus + adaUsaha + keluarga + lainnya;
            document.getElementById('cnt-total-submit').innerText = `(${totalSubmit})`;
            
            document.getElementById('cnt-khusus').innerText = `(${khusus})`;
            document.getElementById('cnt-ada-usaha').innerText = `(${adaUsaha})`;
            document.getElementById('cnt-keluarga').innerText = `(${keluarga})`;
            document.getElementById('cnt-lainnya').innerText = `(${lainnya})`;
            document.getElementById('cnt-draft').innerText = `(${draft})`;
        }

        function highlightFeature(layer) {
            if (selectedLayer) slsLayer.resetStyle(selectedLayer);
            slsLayer.bringToBack(); 
            selectedLayer = layer;
            selectedLayer.setStyle(slsHighlightStyle);
            selectedLayer.bringToFront();
            showActiveLabel(layer);
            renderBangunanForSelectedSLS(layer.feature.properties.idsubsls);
        }

        function locateUser(isStartup = false) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([latitude, longitude], {
                    icon: L.divIcon({
                        className: 'user-loc',
                        html: '<div style="background:#4285F4; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 0 4px rgba(66,133,244,0.4);"></div>',
                        iconSize: [24, 24], iconAnchor: [12, 12]
                    })
                }).addTo(map);
                map.setView([latitude, longitude], 16);
                
                const point = turf.point([longitude, latitude]);
                slsLayer.eachLayer(layer => {
                    if (turf.booleanPointInPolygon(point, layer.toGeoJSON())) {
                        highlightFeature(layer);
                        updateSidebarInfo(layer.feature.properties);
                    }
                });
            }, (err) => { if(!isStartup) alert("Gagal akses lokasi."); }, { enableHighAccuracy: true });
        }

        function searchSLS() {
            const inputVal = document.getElementById('search-id').value.trim();
            if (!inputVal) return;

            let found = false;
            slsLayer.eachLayer(layer => {
                if (layer.feature.properties.idsubsls == inputVal) {
                    found = true;
                    resetAllFilters(); 
                    highlightFeature(layer);
                    updateSidebarInfo(layer.feature.properties);
                    map.flyToBounds(layer.getBounds(), { padding: [40, 40], duration: 1.5 });
                    closeGearPanel();
                }
            });

            if (!found) alert("ID Sub-SLS tidak ditemukan.");
        }

        document.getElementById('gear-btn').onclick = () => {
            const p = document.getElementById('settings-panel');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        };

        const layerCheckboxes = ['chk-khusus-usaha', 'chk-keluarga-ada-usaha', 'chk-keluarga-saja', 'chk-bangunan-lainnya', 'chk-draft'];
        layerCheckboxes.forEach(id => {
            document.getElementById(id).onchange = () => {
                if (selectedLayer) renderBangunanForSelectedSLS(selectedLayer.feature.properties.idsubsls);
            };
        });

        document.getElementById('toggle-bangunan').onchange = (e) => {
            showBangunan = e.target.checked;
            if (selectedLayer) renderBangunanForSelectedSLS(selectedLayer.feature.properties.idsubsls);
        };

        document.getElementById('locate-btn').onclick = () => locateUser(false);
        document.getElementById('reset-filter').onclick = () => resetAllFilters();
        document.getElementById('btn-search').onclick = searchSLS;
        document.getElementById('search-id').onkeypress = (e) => { if (e.key === 'Enter') searchSLS(); };

        map.on('click', (e) => { 
            if (e.originalEvent.target.id === 'map') { 
                closeGearPanel();
                closeSidebar();
            } 
        });

        window.onload = validateAndStart;
    </script>
</body>
</html>
